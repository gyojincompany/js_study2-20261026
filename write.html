<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 글쓰기</title>
</head>
<body>
    <h2>게시판 글쓰기</h2>
    <form>
        작성자 : <input type="text" id="writer"><br>
        글제목 : <input type="text" id="title" size="50"><br>
        글내용 : <textarea rows="5" cols="50" id="content"></textarea>
        <button type="submit" onclick="writeCheck()">글쓰기</button>        
    </form>

    <script>
        function writeCheck() {
            let writer = document.getElementById("writer").value.trim();
            let title = document.getElementById("title").value;
            let content = document.getElementById("content").value;

            if(writer === "") {
                alert("작성자를 입력하세요.");
                return false;
            } 

            // if(title === "") {
            //     alert("제목을 입력하세요");
            //     return false;
            // }

            if(title.length < 5) {
                alert("글 제목은 5글자 이상이어야 합니다.");
                return false;
            }

            if(content.length < 10) {
                alert("글 내용은 10글자 이상이어야 합니다.");
                return false;
            }

            alert("글이 저장되었습니다.");
            return true;
        }
    </script>
</body>
</html>
