<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>탭 메뉴</title>

    <style>
        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab {
            padding: 10px 20px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }

        .tab.active {
            background: #2673e8;
            color: white;
        }

        .content {
            display: none;
            padding: 20px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        .content.active {
            display: block;
        }
    </style>
</head>
<body>

    <h2>상품 상세 정보</h2>

    <div class="tabs">
        <button class="tab active" data-target="info">상품 정보</button>
        <button class="tab" data-target="delivery">배송 안내</button>
        <button class="tab" data-target="review">상품 후기</button>
    </div>

    <div id="info" class="content active">
        고품질 무선 키보드입니다.
    </div>

    <div id="delivery" class="content">
        배송은 결제 후 2~3일 정도 소요됩니다.
    </div>

    <div id="review" class="content">
        상품 후기를 확인할 수 있습니다.
    </div>

    <script>
        const tabs = document.querySelectorAll(".tab");
        //tab 클래스를 가진 모든 요소를 찾아서 저장해라
        //querySelectorAll() 조건에 맞는 요소를 모두 찾아라(여러개일때)
        const contents = document.querySelectorAll(".content");
        //content 클래스를 가진 모든 요소를 찾아서 저장해라

        tabs.forEach(function(tab) {
            //forEach()->반복문, 여러 요소를 하나씩 꺼내서 처리하라
            //탭 버튼이 세개 이므로 함수가 각각 버튼 당 한번씩 실행
            tab.addEventListener("click", function() {

                // 모든 메뉴의 선택 상태 해제
                tabs.forEach(function(item) {
                    item.classList.remove("active");
                });

                // 모든 내용을 숨김
                contents.forEach(function(content) {
                    content.classList.remove("active");
                });

                // 클릭한 메뉴 선택
                tab.classList.add("active");

                // 선택한 메뉴에 해당하는 내용 표시
                const targetId = tab.dataset.target;
                document.getElementById(targetId)
                    .classList.add("active");

            });

        });
    </script>

</body>
</html>
